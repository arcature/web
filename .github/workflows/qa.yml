# Deploy main to the QA stage. QA renders pages on request, so it also serves
# as the draft preview for Sanity's Presentation tool and needs no rebuild when
# content changes.
name: Deploy QA

on:
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/deploy.yml
    with:
      stage: qa
      preview: true
    secrets: inherit
